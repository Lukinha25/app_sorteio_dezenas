<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Conta</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
    <style>
        .box-formulario { background-color: #1a1a1e; padding: 25px; border-radius: 10px; border: 1px solid #29292e; text-align: left; margin-top: 30px; }
        .input-campo { width: 100%; padding: 14px; background-color: #29292e; border: 1px solid #323238; color: #fff; border-radius: 6px; font-size: 16px; margin: 8px 0 18px 0; box-sizing: border-box; }
        .btn-enviar { width: 100%; padding: 15px; background-color: #00e676; color: #121214; font-weight: bold; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-enviar:hover { background-color: #00c862; }
        .link-alternativo { display: block; text-align: center; margin-top: 15px; color: #8d8d99; text-decoration: none; font-size: 14px; }
        .link-alternativo span { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container-app">
        <h2 style="margin-top: 40px;">Crie sua Conta</h2>
        <p class="subtitulo">Preencha os dados abaixo para começar a jogar</p>

        <div class="box-formulario">
            <label for="nome" style="font-size: 14px;">Nome Completo:</label>
            <input type="text" id="nome" class="input-campo" placeholder="Digite seu nome">

            <label for="cpf" style="font-size: 14px;">Seu CPF (Apenas números):</label>
            <input type="text" id="cpf" class="input-campo" placeholder="00000000000" maxlength="11">

            <label for="senha" style="font-size: 14px;">Crie uma Senha:</label>
            <input type="password" id="senha" class="input-campo" placeholder="Digite sua senha">

            <label for="padrinho" style="font-size: 14px;">Código de Indicação (Opcional):</label>
            <input type="text" id="padrinho" class="input-campo" placeholder="Ex: LUCA4852">

            <button id="btn-cadastrar" class="btn-enviar">Concluir Cadastro 🎉</button>
        </div>

        <a href="/login" class="link-alternativo">Já tem uma conta? <span>Entrar aqui</span></a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Captura automática se o usuário veio por um link de indicação (ex: ?ref=CODE)
            const urlParams = new URLSearchParams(window.location.search);
            const refCodigo = urlParams.get('ref');
            if (refCodigo) {
                document.getElementById("padrinho").value = refCodigo.toUpperCase();
            }

            document.getElementById("btn-cadastrar").addEventListener("click", function() {
                const nome = document.getElementById("nome").value;
                const cpf = document.getElementById("cpf").value;
                const senha = document.getElementById("senha").value;
                const padrinho = document.getElementById("padrinho").value;

                if (!nome || !cpf || !senha) {
                    alert("Por favor, preencha todos os campos obrigatórios!");
                    return;
                }

                // Envia os dados para a API do Python que já criamos
                fetch("/api/usuarios/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cpf: cpf, nome: nome, senha: senha, codigo_indizacao: padrinho })
                })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        alert("🎉 Conta criada com sucesso! Seu código de afiliado é: " + dados.seu_codigo_afiliado);
                        window.location.href = "/login"; // Joga o usuário para a tela de login
                    } else {
                        alert("❌ Erro: " + dados.erro);
                    }
                })
                .catch(err => alert("Erro ao conectar com o servidor."));
            });
        });
    </script>
</body>
</html>
